<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargoman Logistics - Login</title><style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f4f6f9;
  min-height:100vh;
}

/* HEADER */

header{
  background:#0b2a45;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  width:50px;
  height:50px;
  border-radius:50%;
  background:white;
  padding:4px;
}

.logo span{
  font-size:20px;
  font-weight:bold;
}

/* LOGIN SECTION */

.container{
  min-height:calc(100vh - 80px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:450px;
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.login-card h1{
  color:#0b2a45;
  text-align:center;
  margin-bottom:10px;
}

.login-card p{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:8px;
  margin-bottom:15px;
  font-size:15px;
}

.remember{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.remember input{
  width:auto;
  margin:0;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  background:#f57c00;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#d96b00;
}

.links{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
}

.links a{
  color:#0b2a45;
  text-decoration:none;
  font-size:14px;
}

.demo{
  margin-top:20px;
  background:#eef3f7;
  padding:15px;
  border-radius:10px;
  font-size:14px;
  line-height:1.8;
}

footer{
  background:#0b2a45;
  color:white;
  text-align:center;
  padding:15px;
}

</style></head><body><header><div class="logo">
<img src="assets/images/logo.png">
<span>Cargoman Logistics</span>
</div></header><div class="container"><div class="login-card"><h1>Login Portal</h1><p>Access your logistics dashboard</p><input type="email" id="email" placeholder="Enter Email"><input type="password" id="password" placeholder="Enter Password"><div class="remember">
<input type="checkbox" id="rememberMe">
<label for="rememberMe">Remember Me</label>
</div><button onclick="login()">Login</button>

<div class="links"><a href="#" onclick="forgotPassword()">Forgot Password?</a>

<a href="index.html">Back Home</a>

</div><div class="demo"><b>Admin</b><br>
admin@cargoman.com / 123456

<br><br>

<b>Manager</b><br>
manager@cargoman.com / 123456

<br><br>

<b>Staff</b><br>
staff@cargoman.com / 123456

</div></div></div>
<footer>
© 2025 Cargoman Logistics · All Rights Reserved
</footer><script>

/* AUTO REDIRECT IF ALREADY LOGGED IN */

if(localStorage.getItem("loggedIn") === "true"){
  window.location.href = "profile.html";
}

/* USERS DATABASE */

const users = {

  "admin@cargoman.com":{
    password:"123456",
    username:"Admin",
    role:"Logistics Administrator"
  },

  "manager@cargoman.com":{
    password:"123456",
    username:"Manager",
    role:"Operations Manager"
  },

  "staff@cargoman.com":{
    password:"123456",
    username:"Staff",
    role:"Logistics Staff"
  }

};

/* LOGIN FUNCTION */

function login(){

  const email =
  document.getElementById("email")
  .value
  .trim()
  .toLowerCase();

  const password =
  document.getElementById("password")
  .value;

  if(
    users[email]
    &&
    users[email].password === password
  ){

    localStorage.setItem(
      "loggedIn",
      "true"
    );

    localStorage.setItem(
      "email",
      email
    );

    localStorage.setItem(
      "username",
      users[email].username
    );

    localStorage.setItem(
      "role",
      users[email].role
    );

    if(
      document.getElementById("rememberMe").checked
    ){
      localStorage.setItem(
        "rememberMe",
        "true"
      );
    }

    alert(
      "Welcome " +
      users[email].username
    );

    window.location.href =
    "profile.html";

  }else{

    alert(
      "Invalid Email or Password"
    );

  }

}

/* ENTER KEY LOGIN */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      login();
    }

  }
);

/* FORGOT PASSWORD */

function forgotPassword(){

  alert(
    "Demo System:\n\nPassword for all demo accounts is:\n123456"
  );

}

</script></body>
</html>
