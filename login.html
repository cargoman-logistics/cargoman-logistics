<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Cargoman Logistics</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f4f6f9;
}

/* HEADER */

header{
  background:#0b2a45;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  width:45px;
  height:45px;
  border-radius:50%;
  background:white;
  padding:4px;
}

.logo span{
  font-size:20px;
  font-weight:bold;
}

/* LOGIN BOX */

.container{
  min-height:90vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px 25px;
  border-radius:16px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.login-box h1{
  text-align:center;
  color:#0b2a45;
  margin-bottom:10px;
}

.login-box p{
  text-align:center;
  color:#666;
  margin-bottom:25px;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  background:#f57c00;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#d96b00;
}

.demo{
  margin-top:18px;
  text-align:center;
  font-size:13px;
  color:#666;
}

/* FOOTER */

footer{
  background:#0b2a45;
  color:white;
  text-align:center;
  padding:15px;
  font-size:14px;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    <img src="assets/images/logo.png">
    <span>Cargoman Logistics</span>
  </div>

</header>

<div class="container">

  <div class="login-box">

    <h1>Login</h1>

    <p>Access your logistics dashboard</p>

    <input type="email" id="email" placeholder="Enter Email">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>

    <div class="demo">
      Demo Login:<br>
      admin@cargoman.com<br>
      123456
    </div>

  </div>

</div>

<footer>
  © 2025 Cargoman Logistics · All Rights Reserved
</footer>

<script>

function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(email === "admin@cargoman.com" && password === "123456"){

    alert("Login Successful!");

    window.location.href = "index.html";

  }else{

    alert("Invalid Email or Password");

  }

}

</script>

</body>
</html>
