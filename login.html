<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Cargoman Logistics</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f9;
  color:#222;
}

/* HEADER */

header{
  background:#0b2a45;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* LOGO */

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:white;
}

.logo img{
  width:48px;
  height:48px;
  border-radius:50%;
  background:white;
  padding:4px;
}

.logo span{
  font-size:19px;
  font-weight:bold;
}

/* MENU BUTTON */

.menu-btn{
  font-size:28px;
  cursor:pointer;
  padding:5px 10px;
  user-select:none;
}

/* NAVIGATION */

nav{
  display:none;
  flex-direction:column;
  background:#0b2a45;
  width:100%;
}

nav a{
  color:white;
  text-decoration:none;
  padding:14px 18px;
  border-top:1px solid rgba(255,255,255,0.1);
  transition:0.3s;
}

nav a:hover{
  background:#123b61;
}

/* MOBILE MENU */

#menu.show{
  display:flex;
}

/* DESKTOP MENU */

@media(min-width:769px){

  header{
    padding:14px 30px;
  }

  nav{
    display:flex !important;
    flex-direction:row;
    justify-content:flex-end;
    align-items:center;
    width:auto;
  }

  nav a{
    border:none;
  }

  .menu-btn{
    display:none;
  }

}

/* LOGIN SECTION */

.container{
  min-height:85vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px 18px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  padding:32px 26px;
  border-radius:18px;
  box-shadow:0 5px 16px rgba(0,0,0,0.08);
}

.login-box h1{
  text-align:center;
  color:#0b2a45;
  margin-bottom:12px;
  font-size:32px;
}

.login-box p{
  text-align:center;
  color:#666;
  margin-bottom:26px;
  font-size:15px;
  line-height:1.7;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:16px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:8px;
  background:#f57c00;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#d96b00;
}

/* DEMO BOX */

.demo{
  margin-top:20px;
  text-align:center;
  font-size:14px;
  color:#555;
  background:#eef3f7;
  padding:14px;
  border-radius:10px;
  line-height:1.8;
}

/* FOOTER */

footer{
  background:#0b2a45;
  color:white;
  text-align:center;
  padding:18px;
  font-size:14px;
}

</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">

    <img src="assets/images/logo.png">

    <span>Cargoman Logistics</span>

  </a>

  <div class="menu-btn" onclick="toggleMenu()">☰</div>

</header>

<nav id="menu">

  <a href="index.html">Home</a>

  <a href="services.html">Services</a>

  <a href="about.html">About</a>

  <a href="contact.html">Contact</a>

  <a href="login.html" id="loginBtn">Login</a>

  <a href="#" id="profileBtn" style="display:none;">Profile</a>

  <a href="#" id="logoutBtn" style="display:none;" onclick="logout()">Logout</a>

</nav>

<div class="container">

  <div class="login-box">

    <h1>Login</h1>

    <p>
      Access your logistics dashboard and shipment management system.
    </p>

    <input type="email" id="email" placeholder="Enter Email">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>

    <div class="demo">

      <b>Demo Login</b>

      <br><br>

      Email:
      admin@cargoman.com

      <br>

      Password:
      123456

    </div>

  </div>

</div>

<footer>

  © 2025 Cargoman Logistics · All Rights Reserved

</footer>

<script>

/* MOBILE MENU */

function toggleMenu(){

  const menu = document.getElementById("menu");

  menu.classList.toggle("show");

}

/* AUTO CLOSE MENU */

const navLinks = document.querySelectorAll("#menu a");

navLinks.forEach(link => {

  link.addEventListener("click", () => {

    document.getElementById("menu").classList.remove("show");

  });

});

/* LOGIN STATE */

if(localStorage.getItem("loggedIn") === "true"){

  document.getElementById("loginBtn").style.display = "none";

  document.getElementById("profileBtn").style.display = "block";

  document.getElementById("logoutBtn").style.display = "block";

}

/* LOGIN SYSTEM */

function login(){

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  if(
    email === "admin@cargoman.com"
    &&
    password === "123456"
  ){

    localStorage.setItem("loggedIn","true");

    alert("Login Successful!");

    window.location.href = "index.html";

  }else{

    alert("Invalid Email or Password");

  }

}

/* LOGOUT */

function logout(){

  localStorage.removeItem("loggedIn");

  alert("Logged Out Successfully");

  window.location.href = "index.html";

}

</script>

</body>
</html>
