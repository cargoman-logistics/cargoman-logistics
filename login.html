<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Cargoman Logistics</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
color:#222;
}

/* HEADER */

header{
background:#0b2a45;
color:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo img{
width:50px;
height:50px;
border-radius:50%;
background:white;
padding:4px;
}

.logo span{
font-size:20px;
font-weight:bold;
}

/* LOGIN CONTAINER */

.container{
min-height:85vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-card{
width:100%;
max-width:450px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.login-card h1{
text-align:center;
color:#0b2a45;
margin-bottom:10px;
}

.login-card p{
text-align:center;
color:#666;
margin-bottom:25px;
}

/* FORM */

input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:12px;
font-size:15px;
}

.remember{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.remember input{
width:auto;
margin:0;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
background:#f57c00;
color:white;
font-size:16px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#d96b00;
}

/* ACCOUNTS */

.accounts{
margin-top:20px;
background:#eef3f7;
padding:15px;
border-radius:12px;
}

.accounts h3{
margin-bottom:15px;
color:#0b2a45;
}

.account{
margin-bottom:15px;
line-height:1.8;
}

.account:last-child{
margin-bottom:0;
}

/* FOOTER */

footer{
background:#0b2a45;
color:white;
text-align:center;
padding:15px;
}

</style>
</head>

<body>

<header>

<div class="logo">

<img src="assets/images/logo.png">

<span>Cargoman Logistics</span>

</div>

</header>

<div class="container">

<div class="login-card">

<h1>Login Portal</h1>

<p>
Access your logistics dashboard
</p>

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="password"
id="password"
placeholder="Enter Password">

<div class="remember">

<input
type="checkbox"
id="rememberMe">

<label for="rememberMe">
Remember Me
</label>

</div>

<button onclick="login()">

Login

</button>

<div class="accounts">

<h3>
Demo Accounts
</h3>

<div class="account">

<b>Admin</b>

<br>

admin@cargoman.com

<br>

123456

</div>

<div class="account">

<b>Manager</b>

<br>

manager@cargoman.com

<br>

123456

</div>

<div class="account">

<b>Staff</b>

<br>

staff@cargoman.com

<br>

123456

</div>

</div>

</div>

</div>
<footer>

© 2025 Cargoman Logistics · All Rights Reserved

</footer>

<script>

/* AUTO LOGIN */

if(
localStorage.getItem("loggedIn")
=== "true"
){

window.location.href =
"profile.html";

}

/* LOGIN SYSTEM */

function login(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value.trim();

const remember =
document.getElementById(
"rememberMe"
).checked;

/* ADMIN */

if(

email ===
"admin@cargoman.com"

&&

password ===
"123456"

){

localStorage.setItem(
"loggedIn",
"true"
);

localStorage.setItem(
"username",
"Admin"
);

localStorage.setItem(
"email",
"admin@cargoman.com"
);

localStorage.setItem(
"role",
"Logistics Administrator"
);

localStorage.setItem(
"customerId",
"CGM-ADMIN-001"
);

if(remember){

localStorage.setItem(
"rememberMe",
"true"
);

}

alert(
"Welcome Admin"
);

window.location.href =
"profile.html";

return;

}

/* MANAGER */

if(

email ===
"manager@cargoman.com"

&&

password ===
"123456"

){

localStorage.setItem(
"loggedIn",
"true"
);

localStorage.setItem(
"username",
"Manager"
);

localStorage.setItem(
"email",
"manager@cargoman.com"
);

localStorage.setItem(
"role",
"Operations Manager"
);

localStorage.setItem(
"customerId",
"CGM-MGR-001"
);

if(remember){

localStorage.setItem(
"rememberMe",
"true"
);

}

alert(
"Welcome Manager"
);

window.location.href =
"profile.html";

return;

}

/* STAFF */

if(

email ===
"staff@cargoman.com"

&&

password ===
"123456"

){

localStorage.setItem(
"loggedIn",
"true"
);

localStorage.setItem(
"username",
"Staff"
);

localStorage.setItem(
"email",
"staff@cargoman.com"
);

localStorage.setItem(
"role",
"Logistics Staff"
);

localStorage.setItem(
"customerId",
"CGM-STF-001"
);

if(remember){

localStorage.setItem(
"rememberMe",
"true"
);

}

alert(
"Welcome Staff"
);

window.location.href =
"profile.html";

return;

}

/* INVALID LOGIN */

alert(
"Invalid Email or Password"
);

}

/* LOGOUT CLEANUP */

function logout(){

localStorage.removeItem(
"loggedIn"
);

localStorage.removeItem(
"rememberMe"
);

window.location.href =
"login.html";

}

</script>

</body>
</html>
