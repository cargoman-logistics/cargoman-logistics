<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Dashboard | Cargoman Logistics</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
color:#222;
}

/* HEADER */

header{
background:#0b2a45;
color:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo img{
width:50px;
height:50px;
border-radius:50%;
background:white;
padding:4px;
}

.logo span{
font-size:20px;
font-weight:bold;
}

/* CONTAINER */

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

/* PROFILE CARD */

.profile-card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
text-align:center;
margin-bottom:20px;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
background:#0b2a45;
display:block;
margin:auto;
margin-bottom:15px;
}

.upload-btn{
margin-top:10px;
}

.profile-card h2{
color:#0b2a45;
margin-bottom:10px;
}

.profile-info{
line-height:2;
margin-top:15px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat-card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 12px rgba(0,0,0,.08);
text-align:center;
}

.stat-card h3{
color:#0b2a45;
margin-bottom:10px;
font-size:18px;
}

.stat-card span{
font-size:30px;
font-weight:bold;
color:#f57c00;
}

/* SHIPMENT MANAGER */

.shipments{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 12px rgba(0,0,0,.08);
margin-bottom:20px;
}

.shipments h2{
color:#0b2a45;
margin-bottom:15px;
}

input,
select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:10px;
font-size:14px;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
background:#f57c00;
color:white;
cursor:pointer;
font-size:14px;
}

button:hover{
background:#d96b00;
}

/* SEARCH */

.search-box{
margin-bottom:20px;
}

/* SHIPMENT LIST */

.shipment-list{
margin-top:15px;
}

.shipment-item{
background:#eef3f7;
padding:15px;
border-radius:10px;
margin-bottom:12px;
line-height:1.8;
}

.shipment-actions{
display:flex;
gap:10px;
margin-top:10px;
flex-wrap:wrap;
}

.edit-btn{
background:#0b2a45;
}

.edit-btn:hover{
background:#17466f;
}

.delete-btn{
background:#d62828;
}

.delete-btn:hover{
background:#b71c1c;
}

/* LOGOUT */

.logout-btn{
width:100%;
margin-top:20px;
}

/* FOOTER */

footer{
background:#0b2a45;
color:white;
text-align:center;
padding:15px;
margin-top:20px;
}

</style>
</head>

<body>

<header>

<div class="logo">
<img src="assets/images/logo.png">
<span>Cargoman Logistics</span>
</div>

</header>

<div class="container">

<!-- PROFILE -->

<div class="profile-card">

<img
id="avatar"
class="avatar"
src="assets/images/logo.png">

<input
type="file"
id="avatarUpload"
class="upload-btn"
accept="image/*">

<h2 id="username">User</h2>

<div class="profile-info">

<p>
📧 <span id="email"></span>
</p>

<p>
🪪 <span id="role"></span>
</p>

<p>
🟢 Active Account
</p>

</div>

</div>

<!-- STATISTICS -->

<div class="stats">

<div class="stat-card">
<h3>Total Shipments</h3>
<span id="totalShipments">0</span>
</div>

<div class="stat-card">
<h3>Delivered</h3>
<span id="deliveredShipments">0</span>
</div>

<div class="stat-card">
<h3>In Transit</h3>
<span id="transitShipments">0</span>
</div>

<div class="stat-card">
<h3>Pending</h3>
<span id="pendingShipments">0</span>
</div>

</div>

<!-- SHIPMENT MANAGER -->

<div class="shipments">

<h2>Shipment Manager</h2>

<div class="search-box">

<input
type="text"
id="searchShipment"
placeholder="Search Tracking ID or Customer Name">

</div>

<input
type="text"
id="trackingId"
placeholder="Tracking ID (KMB1004)">

<input
type="text"
id="customerName"
placeholder="Customer Name">

<input
type="text"
id="from"
placeholder="From">

<input
type="text"
id="to"
placeholder="To">

<input
type="date"
id="bookingDate">

<select id="status">

<option>Delivered</option>

<option>In Transit</option>

<option>Pending</option>

</select>

<button onclick="addShipment()">
Add Shipment
</button>

<div
id="shipmentList"
class="shipment-list">
</div>

</div>
<button
class="logout-btn"
onclick="logout()">
Logout
</button>

</div>

<footer>
© 2025 Cargoman Logistics · All Rights Reserved
</footer>

<script>

/* LOGIN CHECK */

if(localStorage.getItem("loggedIn") !== "true"){

alert("Please Login First");

window.location.href =
"login.html";

}

/* USER DATA */

const username =
localStorage.getItem("username") ||
"User";

const email =
localStorage.getItem("email") ||
"No Email";

const role =
localStorage.getItem("role") ||
"User";

document.getElementById("username")
.innerText = username;

document.getElementById("email")
.innerText = email;

document.getElementById("role")
.innerText = role;

/* AVATAR SYSTEM */

const avatarKey =
"avatar_" + email;

const savedAvatar =
localStorage.getItem(avatarKey);

if(savedAvatar){

document.getElementById("avatar")
.src = savedAvatar;

}

document
.getElementById("avatarUpload")
.addEventListener(
"change",
function(e){

const file =
e.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload =
function(event){

localStorage.setItem(
avatarKey,
event.target.result
);

document
.getElementById("avatar")
.src =
event.target.result;

};

reader.readAsDataURL(file);

}
);

/* SHIPMENT DATABASE */

let shipments =
JSON.parse(
localStorage.getItem("shipments")
) || [

{
tracking:"KMB1001",
customer:"Ramesh Kumar",
from:"Hyderabad",
to:"Delhi",
bookingDate:"2026-06-01",
updatedDate:"2026-06-05",
status:"Delivered"
},

{
tracking:"KMB1002",
customer:"Anita Sharma",
from:"Mumbai",
to:"Bangalore",
bookingDate:"2026-06-03",
updatedDate:"2026-06-04",
status:"In Transit"
},

{
tracking:"KMB1003",
customer:"Rahul Verma",
from:"Chennai",
to:"Kolkata",
bookingDate:"2026-06-05",
updatedDate:"2026-06-05",
status:"Pending"
}

];

/* SAVE DATABASE */

function saveShipments(){

localStorage.setItem(
"shipments",
JSON.stringify(shipments)
);

}

/* SEARCH */

document
.getElementById("searchShipment")
.addEventListener(
"input",
function(){

renderShipments(
this.value.toLowerCase()
);

}
);

/* RENDER SHIPMENTS */

function renderShipments(
searchText = ""
){

const list =
document.getElementById(
"shipmentList"
);

list.innerHTML = "";

let delivered = 0;
let transit = 0;
let pending = 0;

shipments.forEach(
(item,index)=>{

if(
item.status ===
"Delivered"
){
delivered++;
}

if(
item.status ===
"In Transit"
){
transit++;
}

if(
item.status ===
"Pending"
){
pending++;
}

const matches =

item.tracking
.toLowerCase()
.includes(searchText)

||

item.customer
.toLowerCase()
.includes(searchText);

if(!matches) return;

list.innerHTML += `

<div class="shipment-item">

<b>${item.tracking}</b>

<br>

👤 ${item.customer}

<br>

📍 ${item.from}
→
${item.to}

<br>

📅 Booked:
${item.bookingDate}

<br>

🔄 Updated:
${item.updatedDate}

<br>

🚚 Status:
${item.status}

<br>

<div class="shipment-actions">

<button
class="edit-btn"
onclick="editShipment(${index})">

Edit

</button>

<button
class="delete-btn"
onclick="deleteShipment(${index})">

Delete

</button>

</div>

</div>

`;

});

document.getElementById(
"totalShipments"
).innerText =
shipments.length;

document.getElementById(
"deliveredShipments"
).innerText =
delivered;

document.getElementById(
"transitShipments"
).innerText =
transit;

document.getElementById(
"pendingShipments"
).innerText =
pending;

}
  /* ADD SHIPMENT */

function addShipment(){

const tracking =
document.getElementById(
"trackingId"
).value.trim();

const customer =
document.getElementById(
"customerName"
).value.trim();

const from =
document.getElementById(
"from"
).value.trim();

const to =
document.getElementById(
"to"
).value.trim();

const bookingDate =
document.getElementById(
"bookingDate"
).value;

const status =
document.getElementById(
"status"
).value;

if(
!tracking ||
!customer ||
!from ||
!to ||
!bookingDate
){

alert(
"Please fill all fields"
);

return;

}

/* CHECK DUPLICATE */

const exists =
shipments.some(
item =>
item.tracking === tracking
);

if(exists){

alert(
"Tracking ID already exists"
);

return;

}

shipments.push({

tracking:tracking,

customer:customer,

from:from,

to:to,

bookingDate:bookingDate,

updatedDate:
new Date()
.toISOString()
.split("T")[0],

status:status

});

saveShipments();

renderShipments();

clearForm();

alert(
"Shipment Added Successfully"
);

}

/* EDIT SHIPMENT */

function editShipment(index){

const item =
shipments[index];

const customer =
prompt(
"Customer Name",
item.customer
);

if(customer === null)
return;

const status =
prompt(
"Status (Delivered / In Transit / Pending)",
item.status
);

if(status === null)
return;

item.customer =
customer;

item.status =
status;

item.updatedDate =
new Date()
.toISOString()
.split("T")[0];

saveShipments();

renderShipments();

alert(
"Shipment Updated"
);

}

/* DELETE SHIPMENT */

function deleteShipment(index){

const confirmDelete =
confirm(
"Delete this shipment?"
);

if(!confirmDelete)
return;

shipments.splice(
index,
1
);

saveShipments();

renderShipments();

alert(
"Shipment Deleted"
);

}

/* CLEAR FORM */

function clearForm(){

document.getElementById(
"trackingId"
).value = "";

document.getElementById(
"customerName"
).value = "";

document.getElementById(
"from"
).value = "";

document.getElementById(
"to"
).value = "";

document.getElementById(
"bookingDate"
).value = "";

document.getElementById(
"status"
).selectedIndex = 0;

}

/* LOGOUT */

function logout(){

localStorage.removeItem(
"loggedIn"
);

localStorage.removeItem(
"rememberMe"
);

alert(
"Logged Out Successfully"
);

window.location.href =
"login.html";

}

/* INITIALIZE */

saveShipments();

renderShipments();

</script>

</body>
</html>
