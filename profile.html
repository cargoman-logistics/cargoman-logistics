<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Dashboard | Cargoman Logistics</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
color:#222;
}

/* HEADER */

header{
background:#0b2a45;
color:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo img{
width:50px;
height:50px;
border-radius:50%;
background:white;
padding:4px;
}

.logo span{
font-size:20px;
font-weight:bold;
}

/* PROFILE */

.container{
padding:20px;
max-width:1200px;
margin:auto;
}

.profile-card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
text-align:center;
margin-bottom:20px;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
background:#0b2a45;
margin:auto;
display:block;
margin-bottom:15px;
}

.upload-btn{
margin-top:10px;
}

.profile-card h2{
color:#0b2a45;
margin-bottom:10px;
}

.profile-info{
margin-top:15px;
line-height:2;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat-card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 12px rgba(0,0,0,.08);
text-align:center;
}

.stat-card h3{
color:#0b2a45;
margin-bottom:10px;
}

.stat-card span{
font-size:28px;
font-weight:bold;
color:#f57c00;
}

/* SHIPMENTS */

.shipments{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 12px rgba(0,0,0,.08);
margin-bottom:20px;
}

.shipments h2{
margin-bottom:15px;
color:#0b2a45;
}

input,select{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
background:#f57c00;
color:white;
cursor:pointer;
}

button:hover{
background:#d96b00;
}

.shipment-list{
margin-top:15px;
}

.shipment-item{
background:#eef3f7;
padding:12px;
border-radius:8px;
margin-bottom:10px;
}

.logout-btn{
width:100%;
margin-top:20px;
}

footer{
background:#0b2a45;
color:white;
text-align:center;
padding:15px;
margin-top:20px;
}

</style></head><body><header><div class="logo">
<img src="assets/images/logo.png">
<span>Cargoman Logistics</span>
</div></header><div class="container"><div class="profile-card"><img
id="avatar"
class="avatar"
src="assets/images/logo.png">

<input
type="file"
id="avatarUpload"
class="upload-btn"
accept="image/*">

<h2 id="username">User</h2><div class="profile-info"><p>
📧
<span id="email"></span>
</p><p>
🪪
<span id="role"></span>
</p><p>
🟢 Active Account
</p></div></div><div class="stats"><div class="stat-card">
<h3>Total Shipments</h3>
<span id="totalShipments">0</span>
</div><div class="stat-card">
<h3>Delivered</h3>
<span id="deliveredShipments">0</span>
</div><div class="stat-card">
<h3>In Transit</h3>
<span id="transitShipments">0</span>
</div><div class="stat-card">
<h3>Pending</h3>
<span id="pendingShipments">0</span>
</div></div><div class="shipments"><h2>Shipment Manager</h2><input
type="text"
id="trackingId"
placeholder="Tracking ID">

<input
type="text"
id="from"
placeholder="From">

<input
type="text"
id="to"
placeholder="To">

<select id="status"><option>Delivered</option><option>In Transit</option><option>Pending</option></select><button onclick="addShipment()">
Add Shipment
</button><div
id="shipmentList"
class="shipment-list">
</div></div>
<button
class="logout-btn"
onclick="logout()">
Logout
</button>

</div><footer>
© 2025 Cargoman Logistics · All Rights Reserved
</footer><script>

/* LOGIN CHECK */

if(localStorage.getItem("loggedIn") !== "true"){

  alert("Please Login First");

  window.location.href =
  "login.html";

}

/* LOAD USER */

const username =
localStorage.getItem("username") ||
"User";

const email =
localStorage.getItem("email") ||
"No Email";

const role =
localStorage.getItem("role") ||
"User";

document.getElementById("username")
.innerText = username;

document.getElementById("email")
.innerText = email;

document.getElementById("role")
.innerText = role;

/* AVATAR SYSTEM */

const avatarKey =
"avatar_" + email;

const savedAvatar =
localStorage.getItem(avatarKey);

if(savedAvatar){

  document
  .getElementById("avatar")
  .src = savedAvatar;

}

document
.getElementById("avatarUpload")
.addEventListener(
"change",
function(e){

  const file =
  e.target.files[0];

  if(!file) return;

  const reader =
  new FileReader();

  reader.onload =
  function(event){

    localStorage.setItem(
      avatarKey,
      event.target.result
    );

    document
    .getElementById("avatar")
    .src =
    event.target.result;

  };

  reader.readAsDataURL(file);

});

/* SHIPMENT DATABASE */

let shipments =
JSON.parse(
localStorage.getItem("shipments")
) || [

{
tracking:"KMB1001",
from:"Hyderabad",
to:"Delhi",
status:"Delivered"
},

{
tracking:"KMB1002",
from:"Mumbai",
to:"Bangalore",
status:"In Transit"
},

{
tracking:"KMB1003",
from:"Chennai",
to:"Kolkata",
status:"Pending"
}

];

/* SAVE DATABASE */

function saveShipments(){

localStorage.setItem(
"shipments",
JSON.stringify(shipments)
);

}

/* RENDER SHIPMENTS */

function renderShipments(){

const list =
document.getElementById(
"shipmentList"
);

list.innerHTML = "";

let delivered = 0;
let transit = 0;
let pending = 0;

shipments.forEach(
(item,index)=>{

if(item.status==="Delivered")
delivered++;

if(item.status==="In Transit")
transit++;

if(item.status==="Pending")
pending++;

list.innerHTML += `

<div class="shipment-item">

<b>${item.tracking}</b>

<br>

${item.from}
→
${item.to}

<br>

Status:
${item.status}

<br><br>

<button
onclick="deleteShipment(${index})">

Delete

</button>

</div>

`;

});

document.getElementById(
"totalShipments"
).innerText =
shipments.length;

document.getElementById(
"deliveredShipments"
).innerText =
delivered;

document.getElementById(
"transitShipments"
).innerText =
transit;

document.getElementById(
"pendingShipments"
).innerText =
pending;

}

/* ADD SHIPMENT */

function addShipment(){

const tracking =
document.getElementById(
"trackingId"
).value.trim();

const from =
document.getElementById(
"from"
).value.trim();

const to =
document.getElementById(
"to"
).value.trim();

const status =
document.getElementById(
"status"
).value;

if(
!tracking ||
!from ||
!to
){

alert(
"Fill all fields"
);

return;

}

shipments.push({

tracking,
from,
to,
status

});

saveShipments();

renderShipments();

document.getElementById(
"trackingId"
).value = "";

document.getElementById(
"from"
).value = "";

document.getElementById(
"to"
).value = "";

}

/* DELETE SHIPMENT */

function deleteShipment(index){

if(
confirm(
"Delete shipment?"
)
){

shipments.splice(
index,
1
);

saveShipments();

renderShipments();

}

}

/* LOGOUT */

function logout(){

localStorage.removeItem(
"loggedIn"
);

alert(
"Logged Out Successfully"
);

window.location.href =
"login.html";

}

/* START */

renderShipments();

</script></body>
</html>
